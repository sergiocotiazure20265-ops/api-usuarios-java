name: api-usuarios

services:
  postgres:
    image: postgres:16
    container_name: api-usuarios-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bd-usuarios
      POSTGRES_USER: coti
      POSTGRES_PASSWORD: coti

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - api-usuarios-network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: api-usuarios-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "127.0.0.1:5052:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - api-usuarios-network

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - /venv/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/misc/ping', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  pgadmin_data:

networks:
  api-usuarios-network:
    driver: bridge